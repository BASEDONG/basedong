services:
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile.static
    image: basedong-web:latest
    container_name: basedong-web
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  web-dev:
    build:
      context: ./apps/web
      dockerfile: Dockerfile.dev
    image: basedong-web:dev
    container_name: basedong-web-dev
    restart: unless-stopped
    ports:
      - "${DEV_PORT:-3001}:3000"
    environment:
      - NODE_ENV=development
      - NEXT_TELEMETRY_DISABLED=1
    env_file:
      - path: ./apps/web/.env.local
        required: false
      - path: ./apps/web/.env
        required: false
    volumes:
      - ./apps/web:/app
      - /app/node_modules
      - /app/.next
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
