<svg xmlns="http://www.w3.org/2000/svg" width="448" height="448" viewBox="0 0 448 448" fill="none">
  <defs>
    <linearGradient id="hv-core" x1="160" y1="200" x2="288" y2="320" gradientUnits="userSpaceOnUse">
      <stop stop-color="#5DCDE8"/>
      <stop offset="0.55" stop-color="#4AABF0"/>
      <stop offset="1" stop-color="#3A9AE0"/>
    </linearGradient>
    <linearGradient id="hv-top" x1="168" y1="168" x2="280" y2="240" gradientUnits="userSpaceOnUse">
      <stop stop-color="#E8F7FF"/>
      <stop offset="1" stop-color="#A8D8F5"/>
    </linearGradient>
    <linearGradient id="hv-side" x1="168" y1="240" x2="224" y2="300" gradientUnits="userSpaceOnUse">
      <stop stop-color="#3A9AE0"/>
      <stop offset="1" stop-color="#2B7CB8"/>
    </linearGradient>
    <linearGradient id="hv-front" x1="224" y1="240" x2="280" y2="300" gradientUnits="userSpaceOnUse">
      <stop stop-color="#4AABF0"/>
      <stop offset="1" stop-color="#2F86C4"/>
    </linearGradient>
    <linearGradient id="hv-ring" x1="120" y1="120" x2="328" y2="328" gradientUnits="userSpaceOnUse">
      <stop stop-color="#4AABF0" stop-opacity="0.35"/>
      <stop offset="0.5" stop-color="#5DCDE8" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#4AABF0" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- soft atmosphere -->
  <circle cx="224" cy="224" r="168" fill="url(#hv-ring)"/>
  <circle cx="224" cy="224" r="120" fill="#4AABF0" fill-opacity="0.06"/>

  <!-- orbit rings -->
  <ellipse cx="224" cy="236" rx="176" ry="72" stroke="#4AABF0" stroke-opacity="0.22" stroke-width="1.5"/>
  <ellipse cx="224" cy="236" rx="140" ry="56" stroke="#5DCDE8" stroke-opacity="0.28" stroke-width="1.25" stroke-dasharray="4 6"/>
  <circle cx="60" cy="220" r="4" fill="#4AABF0"/>
  <circle cx="388" cy="248" r="3" fill="#5DCDE8"/>
  <circle cx="224" cy="164" r="3.5" fill="#3A9AE0"/>

  <!-- left floating panel -->
  <g transform="translate(28, 96)">
    <rect x="0" y="12" width="108" height="72" rx="10" fill="#F0F9FF" stroke="#B8D9F0" stroke-width="1.5"/>
    <rect x="12" y="26" width="48" height="6" rx="3" fill="#4AABF0" fill-opacity="0.55"/>
    <rect x="12" y="40" width="72" height="4" rx="2" fill="#94A3B8" fill-opacity="0.45"/>
    <rect x="12" y="50" width="64" height="4" rx="2" fill="#94A3B8" fill-opacity="0.35"/>
    <path d="M12 68 L28 58 L44 62 L60 48 L76 54" stroke="#4AABF0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>

  <!-- right floating panel -->
  <g transform="translate(312, 120)">
    <rect x="0" y="0" width="100" height="88" rx="10" fill="#F8FBFE" stroke="#C5DCEF" stroke-width="1.5"/>
    <circle cx="50" cy="40" r="22" fill="#E0F2FE"/>
    <circle cx="50" cy="40" r="22" fill="none" stroke="#4AABF0" stroke-width="5" stroke-dasharray="48 22" stroke-linecap="round" transform="rotate(-90 50 40)"/>
    <text x="50" y="44" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" font-weight="700" fill="#3A9AE0">TK</text>
    <rect x="16" y="70" width="68" height="5" rx="2.5" fill="#CBD5E1" fill-opacity="0.7"/>
  </g>

  <!-- neural nodes above -->
  <g stroke="#4AABF0" stroke-width="1.25" stroke-opacity="0.55">
    <line x1="180" y1="88" x2="224" y2="58"/>
    <line x1="224" y1="58" x2="268" y2="92"/>
    <line x1="180" y1="88" x2="210" y2="118"/>
    <line x1="268" y1="92" x2="238" y2="118"/>
    <line x1="210" y1="118" x2="238" y2="118"/>
  </g>
  <circle cx="180" cy="88" r="5" fill="#5DCDE8"/>
  <circle cx="224" cy="58" r="6" fill="#4AABF0"/>
  <circle cx="268" cy="92" r="5" fill="#3A9AE0"/>
  <circle cx="210" cy="118" r="4" fill="#7DD3FC"/>
  <circle cx="238" cy="118" r="4" fill="#7DD3FC"/>

  <!-- isometric core platform -->
  <g>
    <!-- base slab -->
    <polygon points="224,348 112,292 224,236 336,292" fill="#D6EAF8"/>
    <polygon points="112,292 112,316 224,372 224,348" fill="#8BBFDE"/>
    <polygon points="224,348 224,372 336,316 336,292" fill="#6AA8D0"/>

    <!-- mid deck -->
    <polygon points="224,318 136,274 224,230 312,274" fill="#E8F4FC"/>
    <polygon points="136,274 136,290 224,334 224,318" fill="#7EB6D8"/>
    <polygon points="224,318 224,334 312,290 312,274" fill="#5C9EC8"/>

    <!-- chip body -->
    <polygon points="224,286 168,258 224,230 280,258" fill="url(#hv-top)"/>
    <polygon points="168,258 168,286 224,314 224,286" fill="url(#hv-side)"/>
    <polygon points="224,286 224,314 280,286 280,258" fill="url(#hv-front)"/>

    <!-- chip core glow -->
    <polygon points="224,272 188,254 224,236 260,254" fill="url(#hv-core)" opacity="0.95"/>
    <polygon points="224,258 208,250 224,242 240,250" fill="#FFFFFF" fill-opacity="0.55"/>
  </g>

  <!-- circuit traces on platform -->
  <g stroke="#4AABF0" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.45">
    <path d="M150 300 H190"/>
    <path d="M258 300 H298"/>
    <path d="M190 300 V318"/>
    <path d="M258 300 V318"/>
  </g>
  <circle cx="150" cy="300" r="3" fill="#5DCDE8"/>
  <circle cx="298" cy="300" r="3" fill="#5DCDE8"/>

  <!-- token output streams -->
  <g stroke-linecap="round" fill="none">
    <path d="M224 230 C200 200 170 190 140 176" stroke="#4AABF0" stroke-width="2" opacity="0.5"/>
    <path d="M224 230 C248 200 278 188 308 172" stroke="#5DCDE8" stroke-width="2" opacity="0.5"/>
    <path d="M224 236 C224 200 224 170 224 140" stroke="#3A9AE0" stroke-width="1.75" opacity="0.4" stroke-dasharray="3 5"/>
  </g>

  <!-- small token chips -->
  <g>
    <rect x="118" y="160" width="28" height="18" rx="4" fill="#4AABF0" transform="rotate(-12 132 169)"/>
    <text x="132" y="173" text-anchor="middle" font-family="system-ui,sans-serif" font-size="8" font-weight="700" fill="#fff" transform="rotate(-12 132 169)">tok</text>
    <rect x="302" y="154" width="28" height="18" rx="4" fill="#5DCDE8" transform="rotate(10 316 163)"/>
    <text x="316" y="167" text-anchor="middle" font-family="system-ui,sans-serif" font-size="8" font-weight="700" fill="#0C4A6E" transform="rotate(10 316 163)">tok</text>
  </g>
</svg>
