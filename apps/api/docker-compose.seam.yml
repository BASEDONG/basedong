# Seam CI overlay: mock OpenAI upstream on the same Docker network + sync quota for probes.
#
# Usage:
#   docker compose -f docker-compose.dev.yml -f docker-compose.seam.yml up -d --build
#   BASEDONG_API_BASE=http://localhost:3000 MOCK_UPSTREAM=http://mock-openai:18080 ./scripts/probe-retail.sh

services:
  mock-openai:
    image: python:3.12-alpine
    container_name: basedong-mock-openai
    restart: unless-stopped
    volumes:
      - ./scripts/mock-openai-server.py:/server.py:ro
    command: ["python", "/server.py"]
    networks:
      - dev-network

  new-api:
    environment:
      # Sync 额度 updates so retail probe can assert before/after without waiting for batch flush.
      - BATCH_UPDATE_ENABLED=false
