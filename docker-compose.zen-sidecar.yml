# Zen Sidecar spine overlay (#10 / #11)
#
# Usage (from repo root):
#   docker compose -f docker-compose.yml -f docker-compose.zen-sidecar.yml -p basedong-zen-spine up -d api zen-sidecar
#   bash apps/zen-sidecar/scripts/probe-spine.sh
#   bash apps/zen-sidecar/scripts/probe-auto-nonstream.sh
#
# New API reaches the Sidecar at: http://zen-sidecar:8080
# Do NOT publish zen-sidecar ports to the host — private network only.
#
# Sidecar Credential (Channel.Key): basedong-sidecar-dev-credential
#   (override by editing apps/zen-sidecar/config.poc.json before first volume init)

services:
  # Unique container names so the spine project does not collide with a local `docker compose up api`.
  api:
    container_name: basedong-zen-spine-api
    image: basedong-api:dev
    pull_policy: never

  redis:
    container_name: basedong-zen-spine-redis

  postgres:
    container_name: basedong-zen-spine-pg

  zen-sidecar:
    image: ghcr.io/jasonxu114514/opencode2api:latest
    container_name: basedong-zen-sidecar
    restart: unless-stopped
    # Intentionally no `ports:` — not a customer endpoint.
    environment:
      - CONFIG_SEED_PATH=/run/config/opencode2api.json
      - LISTEN_ADDRESS=0.0.0.0:8080
      - WEBUI_LISTEN_ADDRESS=127.0.0.1:8081
      - TZ=Asia/Shanghai
    volumes:
      - ./apps/zen-sidecar/config.poc.json:/run/config/opencode2api.json:ro
      - zen_sidecar_state:/var/lib/opencode2api
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q -O - http://127.0.0.1:8080/healthz >/dev/null 2>&1 || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 45s

volumes:
  zen_sidecar_state:
