name: Seam status probe

# Black-box Backend HTTP seam: GET /api/status must return success=true
# after building this fork via docker-compose.dev.yml (BASEDONG/basedong#2).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: seam-status-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  probe:
    name: compose.dev build + /api/status
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Build and start stack from this fork
        run: docker compose -f docker-compose.dev.yml up -d --build

      - name: Wait for GET /api/status success
        run: |
          set -euo pipefail
          # Guard against CRLF if the script was edited on Windows
          sed -i 's/\r$//' scripts/probe-status.sh
          chmod +x scripts/probe-status.sh
          for i in $(seq 1 60); do
            echo "attempt $i"
            if body="$(curl -fsS --max-time 5 http://localhost:3000/api/status 2>/tmp/curl.err)"; then
              echo "$body" | head -c 200
              echo
              if echo "$body" | grep -q '"success"[[:space:]]*:[[:space:]]*true'; then
                echo "ok: /api/status success=true"
                exit 0
              fi
              echo "body missing success=true"
            else
              echo "curl failed: $(cat /tmp/curl.err || true)"
            fi
            sleep 5
          done
          docker compose -f docker-compose.dev.yml ps || true
          docker compose -f docker-compose.dev.yml logs --no-color --tail=200 new-api || true
          exit 1

      - name: Tear down
        if: always()
        run: docker compose -f docker-compose.dev.yml down -v